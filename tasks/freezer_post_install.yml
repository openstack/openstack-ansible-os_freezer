- name: Drop freezer Config(s)
  openstack.config_template.config_template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ freezer_system_user_name }}"
    group: "{{ freezer_system_group_name }}"
    mode: "0644"
    config_overrides: "{{ item.config_overrides }}"
    config_type: "{{ item.config_type }}"
  with_items:
    - src: "freezer-api.conf.j2"
      dest: "{{ freezer_etc_dir }}/freezer-api.conf"
      config_overrides: "{{ freezer_api_conf_overrides }}"
      config_type: "ini"
      condition: >-
        {{ (freezer_services['freezer-api']['group'] in group_names and inventory_hostname in groups[freezer_services['freezer-api']['group']]) | bool }}
    - src: "scheduler.conf.j2"
      dest: "{{ freezer_etc_dir }}/scheduler.conf"
      config_overrides: "{{ freezer_scheduler_conf_overrides }}"
      config_type: "ini"
      condition: >-
        {{
          (freezer_services['freezer-scheduler']['group'] in group_names and
            inventory_hostname in groups[freezer_services['freezer-scheduler']['group']]) | bool
        }}
  when: item.condition | default(true)
  notify:
    - Restart freezer services
    - Restart uwsgi services

- name: Configure freezer API
  when:
    - freezer_services['freezer-api']['group'] in group_names
    - inventory_hostname in groups[freezer_services['freezer-api']['group']]
  block:
    - name: Place policy.yaml file
      openstack.config_template.config_template:
        content: "{{ freezer_api_policy_overrides }}"
        dest: "{{ freezer_etc_dir }}/policy.yaml"
        owner: "root"
        group: "{{ freezer_system_group_name }}"
        mode: "0640"
        config_type: "yaml"
      tags:
        - freezer-policy-override

    - name: Preserve original configuration file(s)
      ansible.builtin.command: "cp {{ item.target_f }} {{ item.target_f }}.original"
      args:
        creates: "{{ item.target_f }}.original"
      with_items: "{{ freezer_api_core_files }}"

    - name: Fetch override files
      ansible.builtin.fetch:
        src: "{{ item.target_f }}"
        dest: "{{ item.tmp_f }}"
        flat: true
      changed_when: false
      run_once: true
      check_mode: false
      with_items: "{{ freezer_api_core_files }}"

    - name: Copy common config
      openstack.config_template.config_template:
        src: "{{ item.tmp_f }}"
        dest: "{{ item.target_f_override | default(item.target_f) }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default(freezer_system_group_name) }}"
        mode: "{{ item.mode | default('0640') }}"
        config_overrides: "{{ item.config_overrides }}"
        config_type: "{{ item.config_type }}"
      with_items: "{{ freezer_api_core_files }}"
      notify:
        - Restart freezer services
        - Restart uwsgi services

    - name: Cleanup fetched temp files
      ansible.builtin.file:
        path: "{{ item.tmp_f }}"
        state: absent
      changed_when: false
      delegate_to: localhost
      run_once: true
      with_items: "{{ freezer_api_core_files }}"
